<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Name</title>
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;600&display=swap" rel="stylesheet">
<script>
  // Apply a saved theme choice before first paint (no flash)
  try {
    var t = localStorage.getItem('theme');
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
<style>
  :root {
    --blue: #003399;                    /* deep royal blue */
    --bg: #ffffff;
    --bg-clear: rgba(255, 255, 255, 0); /* same colour, fully transparent (for fades) */
    --fg: var(--blue);
    --menu-width: 50vw;     /* desktop: half the page */
    --menu-offset: 20vw;    /* desktop: menu starts 30% of the way across */
    --font-size: 8vw;
    --speed: 24s;           /* time for one full loop; raise to slow down */
    --fade: 16vh;           /* height of the glass fade above/below the strip */
  }
  /* Dark: follows the system unless the visitor has used the knob */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: var(--blue);
      --bg-clear: rgba(0, 51, 153, 0);
      --fg: #ffffff;
    }
  }
  :root[data-theme="dark"] {
    --bg: var(--blue);
    --bg-clear: rgba(0, 51, 153, 0);
    --fg: #ffffff;
  }
  :root[data-theme="light"] {
    --bg: #ffffff;
    --bg-clear: rgba(255, 255, 255, 0);
    --fg: var(--blue);
  }

  /* Mobile: more room for the huge names */
  @media (max-width: 700px) {
    :root {
      --menu-width: 80vw;
      --menu-offset: 20vw;   /* mobile: shifted ~20% of page width */
      --font-size: 19vw;
      --speed: 16s;
      --fade: 12vh;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Inter Tight", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 600;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  nav {
    position: fixed;
    inset: 0 auto 0 var(--menu-offset);
    width: var(--menu-width);
    overflow: hidden;
  }
  .track {
    display: flex;
    flex-direction: column;
    animation: drift var(--speed) linear infinite;
    will-change: transform;
  }
  /* 4 identical copies; shifting by one copy (25%) loops seamlessly, moving DOWN */
  @keyframes drift {
    from { transform: translateY(-25%); }
    to   { transform: translateY(0); }
  }
  nav.stopped .track { animation-play-state: paused; }

  ul { list-style: none; }
  a {
    display: block;
    color: var(--fg);
    text-decoration: none;
    font-size: var(--font-size);
    line-height: 1.02;
    letter-spacing: -0.035em;
    padding: 0.04em 0;
    width: fit-content;
  }
  a:focus-visible { outline: none; text-decoration: underline; text-decoration-thickness: 0.06em; text-underline-offset: 0.08em; }

  /* Hover: a brief frosted blur-and-fade, like the strip's edge, then back to sharp */
  @keyframes frost {
    0%   { filter: blur(0);   opacity: 1; }
    45%  { filter: blur(7px); opacity: 0.35; }
    100% { filter: blur(0);   opacity: 1; }
  }
  @media (hover: hover) {
    a:hover { animation: frost 0.7s ease; }
  }
  a:active { animation: frost 0.7s ease; }

  /* Static strip at the vertical middle. Fully opaque; the menu goes "behind glass" at its edges. */
  .strip {
    position: fixed;
    left: 0;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    z-index: 2;
    background: var(--bg);
    padding: 1.1rem 3vw 1.2rem var(--menu-offset);  /* text follows the menu's left edge */
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1.5rem;
  }
  /* Soft frosted fade above and below: text dissolves and blurs progressively as it nears the strip */
  .strip::before,
  .strip::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    height: var(--fade);
    pointer-events: none;
    -webkit-backdrop-filter: blur(6px);
            backdrop-filter: blur(6px);
  }
  .strip::before {
    bottom: 100%;
    background: linear-gradient(to top, var(--bg), var(--bg-clear));
    -webkit-mask-image: linear-gradient(to top, #000, transparent);
            mask-image: linear-gradient(to top, #000, transparent);
  }
  .strip::after {
    top: 100%;
    background: linear-gradient(to bottom, var(--bg), var(--bg-clear));
    -webkit-mask-image: linear-gradient(to bottom, #000, transparent);
            mask-image: linear-gradient(to bottom, #000, transparent);
  }

  .name {
    font-size: clamp(1.6rem, 3.2vw, 3rem);
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1.1;
  }
  .tagline {
    margin-top: 0.4rem;
    font-size: clamp(1rem, 1.4vw, 1.25rem);
    font-weight: 400;
    line-height: 1.35;
  }

  /* Dark / light knob */
  .knob {
    flex: none;
    position: relative;
    width: 58px;
    height: 32px;
    padding: 0;
    border: 2px solid var(--fg);
    border-radius: 999px;
    background: transparent;
    cursor: pointer;
  }
  .knob span {
    position: absolute;
    top: 3px;
    left: 3px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--fg);
    transition: transform 0.25s ease;
  }
  .knob[aria-checked="true"] span { transform: translateX(26px); }
  .knob:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    .track { animation: none; }
    a:hover, a:active { animation: none; }
    .knob span { transition: none; }
  }
</style>
</head>
<body>
  <nav id="menu" aria-label="Main">
    <div class="track" id="track">
      <ul>
        <li><a href="/">about</a></li>
        <li><a href="/pubs.html">research</a></li>
        <li><a href="/poetry.html">poetry</a></li>
        <li><a href="/fullcv_20261026.pdf">cv</a></li>
        <li><a href="http://curareartspace.com/no-vision-2020">novision2020</a></li>
        <li><a href="/cloud-field.html">cloudfield</a></li>
      </ul>
    </div>
  </nav>

  <header class="strip">
    <div class="strip-text">
      <h1 class="name">Nicko Reginio Caluya</h1>
      <p class="tagline">is a researcher, writer, & an assistant professor. © 2026 Nicko Caluya · Links · Info</p>
    </div>
    <button class="knob" id="theme" type="button" role="switch" aria-checked="false" aria-label="Dark mode" title="Toggle dark / light"><span></span></button>
  </header>

<script>
  (function () {
    var root = document.documentElement;
    var nav = document.getElementById('menu');
    var track = document.getElementById('track');
    var original = track.querySelector('ul');
    var knob = document.getElementById('theme');

    // Clone 3 extra copies for a seamless loop (hidden from assistive tech / tab order)
    for (var i = 0; i < 3; i++) {
      var copy = original.cloneNode(true);
      copy.setAttribute('aria-hidden', 'true');
      copy.querySelectorAll('a').forEach(function (a) { a.tabIndex = -1; });
      track.appendChild(copy);
    }

    // Tap/click anywhere toggles the animation.
    // Pressing a link freezes the menu (easy to hit) and then navigates; the knob is left alone.
    document.addEventListener('pointerdown', function (e) {
      if (e.target.closest('button')) return;
      if (e.target.closest('a')) nav.classList.add('stopped');
      else nav.classList.toggle('stopped');
    });
    // Keyboard users: pause while tabbing through the links
    original.addEventListener('focusin', function () { nav.classList.add('stopped'); });

    // Dark / light knob
    var media = window.matchMedia('(prefers-color-scheme: dark)');
    function isDark() {
      var t = root.getAttribute('data-theme');
      return t ? t === 'dark' : media.matches;
    }
    function sync() { knob.setAttribute('aria-checked', String(isDark())); }
    knob.addEventListener('click', function () {
      var next = isDark() ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch (e) {}
      sync();
    });
    if (media.addEventListener) media.addEventListener('change', sync);
    sync();
  })();
</script>
</body>
</html>
