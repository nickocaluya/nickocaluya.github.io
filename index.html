  body {
    margin: 0;
    background: white;
    overflow: hidden;
    font-family: system-ui, sans-serif;
  }

  /* --- Marquee Background --- */
  #container {
    position: absolute;
    inset: 0;
    overflow: hidden;
    z-index: 0;
  }

  .marquee-grid {
    position: absolute;
    left: 0;
    width: 100%;
    display: grid;
    row-gap: 3px;
  }

  .marquee-row {
    width: 100%;
    height: 256px;
    overflow: hidden;
  }

  .marquee-track {
    display: flex;
    gap: 3px;
    width: max-content;
    animation: scroll linear infinite;
  }

  .marquee-track:hover {
    animation-play-state: paused;
  }

  .square {
  position: relative;
  width: 256px;
  height: 256px;
    overflow: hidden;
  }

  .square a {
    display: block;
    width: 100%;
    height: 100%;
    position: relative;
  }

  .square img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* TEXT OVERLAY */
  .label {
     position: absolute;

      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);

      bottom: auto;   
      right: auto;    
      
      color: white;
      font-size: 16px;
      font-weight: 600;
      text-align: center;

      z-index: 2;
  }

  /*.label {
    position: absolute;
    left: 12px;
    bottom: 12px;

    color: white;
    font-size: 14px;
    font-weight: 500;

    z-index: 1;
  }*/

  /* subtle readability boost */
  .square::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to top,
      rgba(0,0,0,0.5),
      rgba(0,0,0,0)
    );
  }

    @keyframes scroll {
      from { transform: translateX(0); }
      to   { transform: translateX(-259px); }
    }

  /* --- Overlay Layout --- */
  .overlay {
    position: relative;
    z-index: 1;
    height: 100vh;

    display: flex;
    flex-direction: column;
    justify-content: space-between;

    padding: 32px;
    pointer-events: none; /* allows hover to still hit marquee */
  }

<body>

<div id="container"></div>

<div class="overlay">
  <header>
    <h1>Nicko Reginio Caluya</h1>
    <p>Assistant Professor / Researcher / Writer #ArtXScience</p>
  </header>

  <footer>
    © 2026 Nicko Caluya · Links · Info
  </footer>
</div>

<script>
const items = [
  { img: "img/artx.png", link: "../cloud-field.html", label: "Cloud Field" },
  { img: "img/kantenbouki.png", link: "../pubs.html", label: "Publications" },
  { img: "img/research_sq.png", link: "../research.html", label: "Research" },
  { img: "img/nothing.jpg", link: "http://curareartspace.com/no-vision-2020", label: "#NoVision2020" },
  { img: "img/writing.jpg", link: "../poetry.html", label: "Poetry" },
  { img: "img/gscholar.png", link: "../fullcv_20250206.pdf", label: "Full CV" }
];

const TILE = 259;
const ROW_HEIGHT = 259;
const container = document.getElementById("container");

function createRow(duration, reverse = false) {
  const row = document.createElement("div");
  row.className = "marquee-row";

  const track = document.createElement("div");
  track.className = "marquee-track";
  track.style.animationDuration = duration + "s";
  if (reverse) track.style.animationDirection = "reverse";

  const tiles = Math.ceil(window.innerWidth / TILE) + 2;

  for (let i = 0; i < tiles * 2; i++) {
    const item = items[i % items.length];

    const sq = document.createElement("div");
    sq.className = "square";

    const a = document.createElement("a");
    a.href = item.link;
    a.target = "_blank";

    const img = document.createElement("img");
    img.src = item.img;

    const label = document.createElement("span");
    label.className = "label";
    label.textContent = item.label;

    a.appendChild(img);
    a.appendChild(label);
    sq.appendChild(a);
    track.appendChild(sq);
  }

  row.appendChild(track);
  return row;
}

function populate() {
  container.innerHTML = "";

  const rows = Math.floor(window.innerHeight / ROW_HEIGHT);
  const used = rows * ROW_HEIGHT;
  const offset = Math.floor((window.innerHeight - used) / 2);

  const grid = document.createElement("div");
  grid.className = "marquee-grid";
  grid.style.top = offset + "px";
  grid.style.gridTemplateRows = `repeat(${rows}, 256px)`;

  for (let i = 0; i < rows; i++) {
    grid.appendChild(createRow(5 + i * 0.8, i % 2 === 0));
  }

  container.appendChild(grid);
}

populate();
window.addEventListener("resize", populate);
</script>

</body>
