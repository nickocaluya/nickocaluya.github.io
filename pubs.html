<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Publications</title>
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;600&display=swap" rel="stylesheet">
<script>
  // Apply the saved theme choice before first paint (shared with the landing page)
  try {
    var t = localStorage.getItem('theme');
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
<style>
  :root {
    --blue: #003399;                    /* websafe deep royal blue */
    --bg: #ffffff;
    --bg-clear: rgba(255, 255, 255, 0);
    --fg: var(--blue);
    --menu-offset: 10vw;    /* same left edge as the landing page menu */
    --title-size: 8vw;
    --fade: 10vh;           /* height of the glass fade under the strip */
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: var(--blue);
      --bg-clear: rgba(0, 51, 153, 0);
      --fg: #ffffff;
    }
  }
  :root[data-theme="dark"] {
    --bg: var(--blue);
    --bg-clear: rgba(0, 51, 153, 0);
    --fg: #ffffff;
  }
  :root[data-theme="light"] {
    --bg: #ffffff;
    --bg-clear: rgba(255, 255, 255, 0);
    --fg: var(--blue);
  }
  @media (max-width: 700px) {
    :root {
      --menu-offset: 20vw;
      --title-size: 9vw;
      --fade: 8vh;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Inter Tight", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 600;
    -webkit-tap-highlight-color: transparent;
  }
  a { color: var(--fg); text-decoration: none; }
  a:focus-visible { outline: none; text-decoration: underline; text-decoration-thickness: 0.08em; text-underline-offset: 0.15em; }

  /* Brief frosted blur-and-fade, same as the landing page */
  @keyframes frost {
    0%   { filter: blur(0);   opacity: 1; }
    45%  { filter: blur(7px); opacity: 0.35; }
    100% { filter: blur(0);   opacity: 1; }
  }
  @media (hover: hover) {
    .frost:hover { animation: frost 0.7s ease; }
  }
  .frost:active { animation: frost 0.7s ease; }

  /* ---- Static strip, pinned to the top ---- */
  .strip {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 10;
    background: var(--bg);
    padding: max(1rem, env(safe-area-inset-top)) 3vw 1.1rem var(--menu-offset);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1.5rem;
  }
  /* Content passes behind frosted glass just under the strip */
  .strip::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 100%;
    height: var(--fade);
    pointer-events: none;
    background: linear-gradient(to bottom, var(--bg), var(--bg-clear));
    -webkit-backdrop-filter: blur(6px);
            backdrop-filter: blur(6px);
    -webkit-mask-image: linear-gradient(to bottom, #000, transparent);
            mask-image: linear-gradient(to bottom, #000, transparent);
  }
  .name {
    font-size: clamp(1.6rem, 3.2vw, 3rem);
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1.1;
  }
  .tagline {
    margin-top: 0.4rem;
    font-size: clamp(1rem, 1.4vw, 1.25rem);
    font-weight: 400;
    line-height: 1.35;
  }
  .strip-side {
    flex: none;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 0.6rem;
  }
  .back {
    font-size: 1rem;
    font-weight: 600;
    white-space: nowrap;
  }

  /* Dark / light knob */
  .knob {
    position: relative;
    width: 58px;
    height: 32px;
    padding: 0;
    border: 2px solid var(--fg);
    border-radius: 999px;
    background: transparent;
    cursor: pointer;
  }
  .knob span {
    position: absolute;
    top: 3px;
    left: 3px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--fg);
    transition: transform 0.25s ease;
  }
  .knob[aria-checked="true"] span { transform: translateX(26px); }
  .knob:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }

  /* ---- Page content ---- */
  main {
    padding: calc(var(--strip-h, 6rem) + var(--fade)) 3vw 6rem var(--menu-offset);
    max-width: calc(var(--menu-offset) + 62rem);
  }
  .page-title {
    font-size: var(--title-size);
    font-weight: 600;
    letter-spacing: -0.04em;
    line-height: 1;
    margin-bottom: 2rem;
  }

  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    margin-bottom: 1rem;
  }
  .filters input,
  .filters select {
    font: inherit;
    font-weight: 400;
    font-size: 1rem;
    color: var(--fg);
    background: transparent;
    border: 2px solid var(--fg);
    border-radius: 999px;
    padding: 0.55rem 1.1rem;
    min-width: 0;
  }
  .filters input { flex: 1 1 14rem; }
  .filters input::placeholder { color: var(--fg); opacity: 0.6; }
  .filters select { cursor: pointer; }
  .filters option { background: var(--bg); color: var(--fg); }
  .filters input:focus-visible,
  .filters select:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }

  .year {
    font-size: clamp(2rem, 3vw, 4.5rem);
    font-weight: 600;
    letter-spacing: -0.035em;
    line-height: 1;
    margin: 3rem 0 0.75rem;
  }

  .row-card {
    display: grid;
    grid-template-columns: 140px 1fr;
    gap: 1.25rem;
    align-items: start;
    padding: 1.1rem 0;
  }
  .thumb-wrapper img {
    display: block;
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    border: 1px solid var(--fg);
    border-radius: 4px;
  }
  .title {
    font-size: clamp(1.05rem, 1.5vw, 1.35rem);
    font-weight: 600;
    letter-spacing: -0.01em;
    line-height: 1.25;
  }
  .authors {
    margin-top: 0.3rem;
    font-size: 0.95rem;
    font-weight: 400;
    line-height: 1.4;
    opacity: 0.85;
  }
  .links { margin-top: 0.6rem; font-size: 0.95rem; }
  .doi-link { display: inline-block; font-weight: 600; }
  .no-link { font-weight: 400; opacity: 0.6; }
  .tags { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.7rem; }
  .tag {
    font: inherit;
    font-size: 0.78rem;
    font-weight: 400;
    color: var(--fg);
    background: transparent;
    border: 1.5px solid var(--fg);
    border-radius: 999px;
    padding: 0.15rem 0.7rem;
    cursor: pointer;
  }
  .tag:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  @media (hover: hover) {
    .tag:hover { background: var(--fg); color: var(--bg); }
  }
  .empty { font-weight: 400; margin-top: 2rem; opacity: 0.8; }

  @media (max-width: 700px) {
    .row-card { grid-template-columns: 96px 1fr; gap: 0.9rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .frost:hover, .frost:active { animation: none; }
    .knob span { transition: none; }
  }
</style>
</head>

<body>
  <header class="strip">
    <div class="strip-text">
      <h1 class="name">Nicko Reginio Caluya</h1>
      <p class="tagline">has been publishing academic research papers since 2013.</p>
    </div>
    <div class="strip-side">
      <a class="back frost" href="/">&larr; home</a>
      <button class="knob" id="theme" type="button" role="switch" aria-checked="false" aria-label="Dark mode" title="Toggle dark / light"><span></span></button>
    </div>
  </header>

  <main>
    <h2 class="page-title">publications</h2>

    <div class="filters">
      <input type="text" id="search" placeholder="Search publications..." aria-label="Search publications">

      <select id="yearFilter" aria-label="Filter by year">
        <option value="">All Years</option>
      </select>

      <select id="keywordFilter" aria-label="Filter by keyword">
        <option value="">All Keywords</option>
      </select>
    </div>

    <div id="pubs"></div>
  </main>

<script>
  (function () {
    var root = document.documentElement;

    // ---- Keep the content clear of the fixed strip ----
    var strip = document.querySelector('.strip');
    function setStripHeight() { root.style.setProperty('--strip-h', strip.offsetHeight + 'px'); }
    setStripHeight();
    if ('ResizeObserver' in window) new ResizeObserver(setStripHeight).observe(strip);
    window.addEventListener('resize', setStripHeight);

    // ---- Dark / light knob ----
    var knob = document.getElementById('theme');
    var media = window.matchMedia('(prefers-color-scheme: dark)');
    function isDark() {
      var t = root.getAttribute('data-theme');
      return t ? t === 'dark' : media.matches;
    }
    function sync() { knob.setAttribute('aria-checked', String(isDark())); }
    knob.addEventListener('click', function () {
      var next = isDark() ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch (e) {}
      sync();
    });
    if (media.addEventListener) media.addEventListener('change', sync);
    sync();
  })();

  // ---- Publications ----
  let allPubs = [];

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // Newest first, "Unknown" last
  function yearDesc(a, b) {
    const na = parseInt(a, 10), nb = parseInt(b, 10);
    if (isNaN(na) && isNaN(nb)) return 0;
    if (isNaN(na)) return 1;
    if (isNaN(nb)) return -1;
    return nb - na;
  }

  fetch('./assets/publications.json')
    .then(res => {
      if (!res.ok) throw new Error(res.status);
      return res.json();
    })
    .then(data => {
      allPubs = data.map(normalize);
      initFilters(allPubs);
      render(allPubs);
    })
    .catch(() => {
      $("pubs").innerHTML = '<p class="empty">Couldn’t load the publications list.</p>';
    });

  function normalize(p) {
    let year = "Unknown";

    // CSL-JSON format (Zotero default)
    if (p.issued && p.issued["date-parts"]) {
      year = p.issued["date-parts"][0][0];
    }
    // Fallback (other formats)
    else if (p.date) {
      year = (p.date.match(/\d{4}/) || [])[0] || "Unknown";
    }

    const authors = (p.creators || p.author || [])
      .map(a => {
        if (a.family) return `${a.given || ""} ${a.family}`.trim(); // CSL format
        return `${a.firstName || ""} ${a.lastName || ""}`.trim();
      })
      .join(", ");

    const keywords = (p.tags || p.keyword || [])
      .map(k => k.tag || k);

    const thumbnail =
      p.thumbnail ||
      p.attachments?.[0]?.url ||
      "assets/thumbnail.png";

    const doi =
      p.DOI ||
      p.doi ||
      (p.URL && p.URL.includes("doi.org") ? p.URL : null);

    return {
      title: p.title || "Untitled",
      authors,
      year: String(year),
      keywords,
      thumbnail,
      doi,
      abstract: p.abstractNote || p.abstract || "",
      raw: p
    };
  }

  function initFilters(pubs) {
    const years = [...new Set(pubs.map(p => p.year))].sort(yearDesc);
    const keywords = [...new Set(pubs.flatMap(p => p.keywords))].sort();

    years.forEach(y => $("yearFilter").add(new Option(y, y)));
    keywords.forEach(k => $("keywordFilter").add(new Option(k, k)));

    $("search").oninput = applyFilters;
    $("yearFilter").onchange = applyFilters;
    $("keywordFilter").onchange = applyFilters;
  }

  function applyFilters() {
    const search = $("search").value.toLowerCase();
    const year = $("yearFilter").value;
    const keyword = $("keywordFilter").value;

    const filtered = allPubs.filter(p => {
      const matchSearch =
        p.title.toLowerCase().includes(search) ||
        p.authors.toLowerCase().includes(search) ||
        p.keywords.join(" ").toLowerCase().includes(search);

      const matchYear = !year || p.year === year;
      const matchKeyword = !keyword || p.keywords.includes(keyword);

      return matchSearch && matchYear && matchKeyword;
    });

    render(filtered);
  }

  function render(pubs) {
    const container = $("pubs");
    container.innerHTML = "";

    if (!pubs.length) {
      container.innerHTML = '<p class="empty">No matching publications.</p>';
      return;
    }

    const grouped = {};
    pubs.forEach(p => {
      if (!grouped[p.year]) grouped[p.year] = [];
      grouped[p.year].push(p);
    });

    Object.keys(grouped).sort(yearDesc).forEach(year => {
      const section = document.createElement("section");
      section.innerHTML = `<h2 class="year">${esc(year)}</h2>`;

      grouped[year].forEach(p => {
        const card = document.createElement("div");
        card.className = "row-card";

        const doiHref = p.doi
          ? (p.doi.startsWith("http") ? p.doi : "https://doi.org/" + p.doi)
          : "";

        card.innerHTML = `
          <div class="thumb-wrapper">
            <img src="${esc(p.thumbnail)}" alt="" loading="lazy"
                 onerror="this.onerror=null;this.src='assets/thumbnail.png'">
          </div>

          <div class="content">
            <div class="title">${esc(p.title)}</div>
            <div class="authors">${esc(p.authors)}</div>

            <div class="links">
              ${
                p.doi
                  ? `<a href="${esc(doiHref)}" target="_blank" rel="noopener" class="doi-link frost">View paper ↗</a>`
                  : `<span class="no-link">No DOI available</span>`
              }
            </div>

            <div class="tags">
              ${p.keywords.map(k => `<button type="button" class="tag" data-k="${esc(k)}">${esc(k)}</button>`).join("")}
            </div>
          </div>
        `;

        // Tag click filters by that keyword
        card.querySelectorAll(".tag").forEach(tag => {
          tag.onclick = () => {
            $("keywordFilter").value = tag.dataset.k;
            applyFilters();
          };
        });

        section.appendChild(card);
      });

      container.appendChild(section);
    });
  }
</script>
</body>
</html>
